[project]
name = "nfsu-library-chatbot"
version = "0.1.0"
description = "Personalised Research Assistant for NFSU KOHA OPAC"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
# Prompt-injection guard (Llama Prompt Guard 2). Optional so the pipeline still
# runs if torch/transformers are unavailable.
guard = [
    "transformers>=4.46",
    "torch>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.uv]
# CPU-only torch keeps the install (and hackathon laptop) small.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
